<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Taça place_holder{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <h1>Taça place_holder</h1>
  </header>
  <hr class="separador">

  <div class="layout">
    <nav class="sidebar">
      <ul>
        <li><a href="{{ url_for('pagina1') }}">Página 1</a></li>
        <li>
          <a href="#" class="menu-expansivel" id="toggle-pagina2">Página 2</a>
          <ul class="submenu" id="submenu-pagina2">
            <li><a href="{{ url_for('subpagina1') }}">Sub página 1</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <main class="conteudo">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
